name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "ruff>=0.6"
      - name: Ruff
        run: python -m ruff check --output-format github .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Tests with coverage
        run: python -m pytest --cov=pyqs --cov-report=xml --cov-report=term
      - name: Smoke test the CLI against the bundled banks
        run: |
          python -m pyqs summary examples
          python -m pyqs topics examples -f json > /dev/null
          python -m pyqs validate examples
      - name: Strict validation of the clean example banks
        run: |
          for bank in examples/example1.xml examples/jee_*.xml examples/multi_paper.xml; do
            python -m pyqs validate "$bank" --strict
          done
      - name: schema_cookbook.xml must fail strict validation
        run: |
          if python -m pyqs validate examples/schema_cookbook.xml --strict; then
            echo "expected strict validation to reject the cookbook's deliberate warnings" >&2
            exit 1
          fi
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test the installed console script
        run: |
          pyqs --version
          pyqs summary examples
          pyqs topics examples -f json > /dev/null
          pyqs validate examples
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
